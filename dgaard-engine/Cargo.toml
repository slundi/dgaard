[package]
name = "dgaard-engine"
version = "0.2.0"
authors = ["Sébastien LUNDI"]
categories = ["network-programming", "text-processing"]
edition = "2024"
keywords = ["dns", "filter", "security", "dga", "heuristics"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://codeberg.org/slundi/dgaard"
description = "Embeddable DNS filtering engine: blocklists, DGA detection, entropy analysis, heuristics and policy checks. No async runtime — suitable for MTA, HTTP services, or any Rust application."

[lib]
name = "dgaard_engine"
path = "src/lib.rs"

[dependencies]
thiserror.workspace = true

# DNS Protocol handling (for domain validation)
hickory-resolver.workspace = true

# Fast hashing for the u64 fingerprints
twox-hash.workspace = true

# Configuration parsing
toml-span.workspace = true

# High-performance matching
regex.workspace = true

# For lexical analysis
aho-corasick.workspace = true

# Logging (Lightweight)
log.workspace = true

bitflags.workspace = true

# GeoIP country lookup — optional, enabled by the `geoip` feature.
maxminddb = { workspace = true, optional = true }

[features]
default = []
# GeoIP country-based suspicion scoring. Pulls in `maxminddb` and its
# memory-mapped reader. Off by default: CDN edge IPs make country signals
# noisy (a legitimate domain can resolve into a "suspicious" country), and the
# dependency plus mmap machinery are dead weight on the common OpenWrt build
# where GeoIP is not used. When disabled, `Config::validate` rejects any config
# that sets `security.geo_ip.enabled = true`.
geoip = ["dep:maxminddb"]

[dev-dependencies]
tempfile.workspace = true
