<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>dgaard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #f7f8fc;
      --header-bg: #1e3a5f;
      --text:      #2d3748;
      --muted:     #718096;
      --border:    #e2e8f0;
      --safe:      #276749;
      --safe-bg:   #c6f6d5;
      --warn:      #975a16;
      --warn-bg:   #fefcbf;
      --high:      #c05621;
      --high-bg:   #feebc8;
      --crit:      #c53030;
      --crit-bg:   #fed7d7;
      --radius:    6px;
    }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      background: var(--bg);
      color: var(--text);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--header-bg);
      color: #fff;
    }

    .logo {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .logo span { opacity: 0.6; font-weight: 400; }

    #btn-settings {
      background: none;
      border: none;
      color: rgba(255,255,255,0.7);
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      padding: 2px;
      transition: color 0.15s;
    }
    #btn-settings:hover { color: #fff; }

    main { padding: 14px; }

    /* Loading / Error states */
    .state-msg {
      color: var(--muted);
      text-align: center;
      padding: 16px 0;
    }
    .error-msg {
      color: var(--crit);
      font-size: 12px;
      line-height: 1.5;
    }

    /* Domain */
    .domain {
      font-size: 14px;
      font-weight: 600;
      word-break: break-all;
      margin-bottom: 12px;
    }

    /* Score row */
    .score-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .score-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 18px;
      font-weight: 800;
      flex-shrink: 0;
    }

    .score-badge.safe  { background: var(--safe-bg);  color: var(--safe); }
    .score-badge.warn  { background: var(--warn-bg);  color: var(--warn); }
    .score-badge.high  { background: var(--high-bg);  color: var(--high); }
    .score-badge.crit  { background: var(--crit-bg);  color: var(--crit); }

    .status-pill {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .status-pill.allowed { background: var(--safe-bg); color: var(--safe); }
    .status-pill.blocked { background: var(--crit-bg); color: var(--crit); }

    /* Action */
    .action {
      font-size: 11px;
      color: var(--muted);
      font-family: 'SFMono-Regular', Consolas, monospace;
      margin-bottom: 10px;
      word-break: break-all;
    }

    /* Reasons */
    .reasons-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .reasons-list {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .reason-chip {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--crit-bg);
      color: var(--crit);
      font-size: 11px;
      font-family: 'SFMono-Regular', Consolas, monospace;
    }

    hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 10px 0;
    }

    footer {
      padding: 8px 14px;
      border-top: 1px solid var(--border);
      text-align: right;
    }

    footer a {
      font-size: 11px;
      color: var(--header-bg);
      text-decoration: none;
    }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <span class="logo">dgaard <span>threat</span></span>
    <button id="btn-settings" title="Settings" aria-label="Open settings">⚙</button>
  </header>

  <main>
    <div id="state-loading" class="state-msg">Checking…</div>

    <div id="state-unavailable" class="state-msg" hidden>
      Not available for this page.
    </div>

    <div id="state-error" hidden>
      <p class="error-msg" id="error-msg"></p>
    </div>

    <div id="state-result" hidden>
      <div class="domain" id="domain"></div>
      <div class="score-row">
        <div class="score-badge" id="score-badge"></div>
        <div class="status-pill" id="status-pill"></div>
      </div>
      <div class="action" id="action"></div>
      <div id="reasons-section" hidden>
        <div class="reasons-label">Reasons</div>
        <div class="reasons-list" id="reasons-list"></div>
      </div>
    </div>
  </main>

  <footer id="footer" hidden>
    <a id="monitor-link" href="#" target="_blank" rel="noopener">Open Monitor →</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
