# dgaard-monitor — example configuration
# Copy to dgaard-monitor.toml and adjust to your environment.
# Pass to the binary with:  dgaard-monitor -c /path/to/dgaard-monitor.toml

# ---------------------------------------------------------------------------
# Input — where to read events from
# ---------------------------------------------------------------------------
[input]
# Unix Domain Socket exposed by the dgaard DNS proxy.
socket = "/var/run/dgaard/stats.sock"

# Binary host-index file produced by dgaard (hash → domain mapping).
index = "/var/dgaard/host_mapping.bin"

# ---------------------------------------------------------------------------
# Persistence — local SQLite storage
# ---------------------------------------------------------------------------
[persistence]
db = "/var/dgaard/stats.sqlite"

# Rolling event log retention (Tier 1).
events_retention_hours = 72

# Hourly aggregates retention (Tier 2).
aggregates_retention_days = 90

# ---------------------------------------------------------------------------
# TUI — terminal user interface
# ---------------------------------------------------------------------------
[tui]
# Terminal refresh rate in milliseconds.
tick_ms = 250

# Key bindings (single character or named key: "space", "up", "down", …).
key_quit = "q"
key_pause = "space"
key_scroll_up = "up"
key_scroll_down = "down"

# ---------------------------------------------------------------------------
# Forwarding — route enriched events to external sinks
# ---------------------------------------------------------------------------
[forwarding]
# Write formatted lines to a file (omit to write to stdout).
# file = "/var/log/dgaard/dns.log"

# Template for each forwarded line.
# Available placeholders: {timestamp}, {client_ip}, {action}, {domain}
template = "{timestamp} {client_ip} {action} {domain}"

# HTTP(S) endpoint for JSON POST (SOAR, Slack incoming webhook, …).
# forward_url = "https://soar.internal/api/v1/dns-alert"

# Which action variants to forward.  Empty list = forward all events.
# Valid values: "Allowed", "Proxied", "Blocked", "Suspicious", "HighlySuspicious"
filter = ["Blocked", "Suspicious", "HighlySuspicious"]

# ---------------------------------------------------------------------------
# Server — shared listener settings inherited by every REST module
# ---------------------------------------------------------------------------
# The four modules below (api/websocket/mcp/web) each bind their own port
# but share the listen address and bearer token from this section.
[server]
listen = "127.0.0.1"
token = "changeme"

# ---------------------------------------------------------------------------
# REST API
# ---------------------------------------------------------------------------
[api]
enabled = false
port = 8080
root_path = "/api/v1"

# ---------------------------------------------------------------------------
# WebSocket — live event stream
# ---------------------------------------------------------------------------
[websocket]
enabled = false
port = 8081
root_path = "/ws"

# ---------------------------------------------------------------------------
# MCP — Model Context Protocol endpoint
# ---------------------------------------------------------------------------
[mcp]
enabled = false
port = 8082
root_path = "/mcp"

# ---------------------------------------------------------------------------
# Web UI — embedded SPA (mounted at "/")
# ---------------------------------------------------------------------------
[web]
enabled = false
port = 8083

# Maximum number of DNS events kept in the in-memory rolling log.
history_size = 1000

# --- Beaconing detection (GET /api/v1/beaconing) ---
# Minimum number of queries from a single client to the same domain before
# the pair is eligible for beaconing analysis.
beaconing_min_observations = 5

# Coefficient of Variation (std_dev / mean) of inter-arrival times below
# which a client/domain pair is flagged as a potential beacon.
# Lower = stricter.  0.15 catches highly regular C2 beacons while avoiding
# most false positives from bursty-but-periodic background traffic.
beaconing_cov_threshold = 0.15

# ---------------------------------------------------------------------------
# NATS — optional pub/sub federation
# ---------------------------------------------------------------------------
# Lets one monitor publish enriched events on a NATS subject and subscribe
# to another daemon's or monitor's feed. Disabled by default; when enabled
# the local Unix socket input still runs in parallel.
[nats]
enabled = false
url = "nats://127.0.0.1:4222"

# Subject the monitor publishes enriched events on. Empty disables this leg.
publish_subject = "dgaard.events"

# Subject the monitor subscribes to. Set to "dgaard.events" to relay events
# from a peer monitor, or "dgaard.scores" to consume a daemon's scoring
# feed. Empty disables this leg.
subscribe_subject = ""
