# dgaard-monitor — example configuration
# Copy to dgaard-monitor.toml and adjust to your environment.
# Pass to the binary with:  dgaard-monitor -c /path/to/dgaard-monitor.toml
#
# Unknown sections or keys and out-of-range values are startup errors, so a
# typo never falls back silently to a default.

# ---------------------------------------------------------------------------
# Input — where to read events from
# ---------------------------------------------------------------------------
[input]
# Unix Domain Socket exposed by the dgaard DNS proxy. Must match
# server.stats_socket_path in dgaard's config (both default to
# /tmp/dgaard_stats.sock).
socket = "/var/run/dgaard/stats.sock"

# Who may serve that socket. Without this setting the monitor trusts root,
# its own user, or the socket's owner when the socket sits in a directory
# other users cannot write to (e.g. /run/dgaard). A socket created by another
# user in a world-writable directory such as /tmp is refused, since anyone
# could have planted it. Set the UID dgaard runs as to trust it explicitly.
# peer_uid = 997

# Binary host-index file produced by dgaard (hash → domain mapping). Must
# match sources.host_index_path in dgaard's config (both default to
# /var/dgaard/host_mapping.bin).
index = "/var/dgaard/host_mapping.bin"

# dgaard engine config, read only for its [[security.custom_flags]] so that
# custom reason bits 16–31 show their configured `code` (e.g. AI_GENERATED)
# in JSON, SQLite, forwarding and the TUI instead of CUSTOM_BIT_<n>.
# engine_config_path = "/etc/dgaard/dgaard.toml"

# Capacity of the internal event bus, in events (256 to 65536). A sink that
# falls further behind (slow disk, slow HTTP endpoint) loses events; losses
# are counted per sink, reported by the web /stats endpoint and at shutdown.
event_buffer = 8192

# ---------------------------------------------------------------------------
# Persistence — local SQLite storage
# ---------------------------------------------------------------------------
[persistence]
# Keep a local SQLite history. Set to false to run without one (e.g. as a
# non-root user or on a diskless router); REST history routes then answer 503.
enabled = true

db = "/var/dgaard/stats.sqlite"

# Rolling event log retention (Tier 1).
events_retention_hours = 72

# Hourly aggregates retention (Tier 2).
aggregates_retention_days = 90

# ---------------------------------------------------------------------------
# Stats — in-memory statistics
# ---------------------------------------------------------------------------
# The sliding window of recent events feeds the REST API, MCP and web UI
# (live queries, QPS, top reasons). It is only kept when one of them is
# enabled, and never holds more than `max_window_events` events, whatever
# the query rate. Per-domain hit counts are bounded too (50 000 domains).
[stats]
# Length of the window, in seconds (60 to 86400).
window_secs = 3600

# Cap on events kept in the window (0 disables it). 56 bytes per event,
# so the default holds at most ~11 MB.
max_window_events = 200000

# ---------------------------------------------------------------------------
# TUI — terminal user interface
# ---------------------------------------------------------------------------
[tui]
# Terminal refresh rate in milliseconds.
tick_ms = 250

# Key bindings (single character or named key: "space", "up", "down", …).
key_quit = "q"
key_pause = "space"
key_scroll_up = "up"
key_scroll_down = "down"

# ---------------------------------------------------------------------------
# Forwarding — route enriched events to external sinks
# ---------------------------------------------------------------------------
[forwarding]
# Forwarding runs only when `file` and/or `forward_url` is set. It never
# writes to stdout, which belongs to the TUI or to the headless JSON stream.

# Append formatted lines to this file.
# file = "/var/log/dgaard/dns.log"

# Template for each forwarded line.
# Available placeholders: {timestamp}, {client_ip}, {action}, {domain}
template = "{timestamp} {client_ip} {action} {domain}"

# HTTP(S) endpoint for JSON POST (SOAR, Slack incoming webhook, …).
# forward_url = "https://soar.internal/api/v1/dns-alert"

# Which action variants to forward.  Empty list = forward all events.
# Valid values (case-insensitive): "Allowed", "Proxied", "Blocked",
# "Suspicious", "HighlySuspicious", "Override", "Cached", "UpstreamError",
# "DnssecBogus". An unknown name is a startup error.
filter = ["Blocked", "Suspicious", "HighlySuspicious"]

# ---------------------------------------------------------------------------
# Server — shared listener settings inherited by every REST module
# ---------------------------------------------------------------------------
# The four modules below (api/websocket/mcp/web) each bind their own port
# but share the listen address and bearer token from this section.
[server]
listen = "127.0.0.1"
token = "changeme"

# ---------------------------------------------------------------------------
# REST API
# ---------------------------------------------------------------------------
[api]
enabled = false
port = 8080
root_path = "/api/v1"

# ---------------------------------------------------------------------------
# WebSocket — live event stream
# ---------------------------------------------------------------------------
[websocket]
enabled = false
port = 8081
root_path = "/ws"

# ---------------------------------------------------------------------------
# MCP — Model Context Protocol endpoint
# ---------------------------------------------------------------------------
[mcp]
enabled = false
port = 8082
root_path = "/mcp"

# ---------------------------------------------------------------------------
# Web UI — embedded SPA (mounted at "/")
# ---------------------------------------------------------------------------
[web]
enabled = false
port = 8083

# Maximum number of DNS events kept in the in-memory rolling log.
history_size = 1000

# --- Beaconing detection (GET /api/v1/beaconing) ---
# Minimum number of queries from a single client to the same domain before
# the pair is eligible for beaconing analysis.
beaconing_min_observations = 5

# Coefficient of Variation (std_dev / mean) of inter-arrival times below
# which a client/domain pair is flagged as a potential beacon.
# Lower = stricter.  0.15 catches highly regular C2 beacons while avoiding
# most false positives from bursty-but-periodic background traffic.
beaconing_cov_threshold = 0.15

# ---------------------------------------------------------------------------
# NATS — optional pub/sub federation
# ---------------------------------------------------------------------------
# Lets one monitor publish enriched events on a NATS subject and subscribe
# to another daemon's or monitor's feed. Disabled by default; when enabled
# the local Unix socket input still runs in parallel. The broker may start
# after the monitor: the connection is retried in the background.
[nats]
enabled = false
url = "nats://127.0.0.1:4222"

# Subject the monitor publishes enriched events on. Empty disables this leg.
# Dot-separated tokens, no spaces, no wildcards (checked at startup).
publish_subject = "dgaard.events"

# Subject the monitor subscribes to, e.g. "dgaard.events" to receive events
# from peer monitors. (dgaard-daemon's "dgaard.scores" feed uses another
# format and cannot be read here.) Empty disables this leg. Wildcards are allowed as whole
# tokens: `*` matches one token, `>` (last token only) matches the rest.
# Only events from the local daemon are published: events received here are
# never re-published, so monitors sharing one subject do not loop. The
# connection disables server echo, so a monitor does not receive its own
# events back either.
subscribe_subject = ""
