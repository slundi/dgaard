[package]
name = "digaard"
version = "0.2.0"
authors = ["Sébastien LUNDI"]
categories = ["network-programming", "command-line-utilities"]
edition = "2024"
keywords = ["dns", "dig", "lookup", "cli"]
license = "GPL-3.0-only"
readme = "README.md"
repository = "https://codeberg.org/slundi/dgaard"
description = "A modern DNS lookup CLI — dig done right."

[lib]
name = "digaard"
path = "src/lib.rs"

[[bin]]
name = "digaard"
path = "src/main.rs"

[dependencies]
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }

# CLI
bpaf.workspace = true

# DNS protocol primitives
hickory-proto = { workspace = true, features = ["dnssec-ring"] }

# IDN conversion
idna.workspace = true

# Randomness for cookies etc.
getrandom.workspace = true

# DoH transport (reuses workspace HTTP stack)
http-body-util.workspace = true
hyper = { workspace = true }
hyper-rustls = { workspace = true }
hyper-util = { workspace = true }
rustls.workspace = true

# DoT transport
rustls-pemfile = "2"
tokio-rustls = "0.26"
webpki-roots = "1.0.8"

# DoQ transport
quinn.workspace = true

# Structured output
serde.workspace = true
serde_json.workspace = true

# Logging
env_logger.workspace = true
log.workspace = true

# Config file
toml-span.workspace = true

# GeoIP country lookup — optional, enabled by the `geoip` feature.
maxminddb = { workspace = true, optional = true }

[features]
default = []
# Country annotation of A/AAAA records from a MaxMind .mmdb (the `--mmdb` flag).
# Off by default to keep the CLI free of the maxminddb dependency; when
# disabled, `--mmdb` reports that GeoIP support was not compiled in.
geoip = ["dep:maxminddb"]

[dev-dependencies]
rcgen = "0.14.8"
tokio = { workspace = true, features = ["process"] }
