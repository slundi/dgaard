[package]
name = "digaard"
version = "0.1.0"
authors = ["Sébastien LUNDI"]
categories = ["network-programming", "command-line-utilities"]
edition = "2024"
keywords = ["dns", "dig", "lookup", "cli"]
license = "GPLv3"
readme = "README.md"
repository = "https://codeberg.org/slundi/dgaard"
description = "A modern DNS lookup CLI — dig done right."

[lib]
name = "digaard"
path = "src/lib.rs"

[[bin]]
name = "digaard"
path = "src/main.rs"

[dependencies]
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }

# CLI
bpaf.workspace = true

# DNS protocol primitives
hickory-proto = { workspace = true, features = ["dnssec-ring"] }

# IDN conversion
idna.workspace = true

# Randomness for cookies etc.
getrandom.workspace = true

# DoH transport (reuses workspace HTTP stack)
http-body-util.workspace = true
hyper = { workspace = true }
hyper-rustls = { workspace = true }
hyper-util = { workspace = true }
rustls.workspace = true

# DoT transport
rustls-pemfile = "2"
tokio-rustls = "0.26"
webpki-roots = "0.26"

# DoQ transport
quinn.workspace = true

# Structured output
serde.workspace = true
serde_json.workspace = true

# Logging
env_logger.workspace = true
log.workspace = true

[dev-dependencies]
rcgen = "0.13"
tokio = { workspace = true, features = ["process"] }
