# -----------------------------------------------------------------------------
# Dgaard Configuration File
# -----------------------------------------------------------------------------

[server]
# The address and port your proxy listens on (usually port 53 for DNS)
listen_addr = "192.168.1.1:53"

# Resolution backend for "clean" queries that survive the filter pipeline:
#   "forwarder" (default) — delegate to the servers in [forwarder] below.
#   "recursive"           — iterative resolution from the root hints.
#
# Recursive mode is incompatible with DNSSEC validation until Phase 6 ships
# (see docs/Roadmap-recursive-DNS.md). dgaard refuses to start if both
# mode = "recursive" and [security.dnssec] enabled = true.
mode = "forwarder"

# Networks allowed to use this proxy (Access Control List)
allowed_networks = ["127.0.0.1/32", "192.168.1.0/24"]
# Port for the Unix Socket stats stream
stats_socket_path = "/var/run/dgaard/stats.sock"

# Reject any domain containing non-ANSI characters (Punycode)
block_idn = true

# Optional Prometheus scrape endpoint.
# When set, dgaard binds an HTTP server on this address and exposes
# /metrics in OpenMetrics text format (Content-Type: text/plain; version=0.0.4).
# Leave commented out (the default) to disable the endpoint entirely.
#
# Exposed counters:
#   dgaard_queries_total   — every DNS query received
#   dgaard_queries_blocked — queries blocked by any filter
#   dgaard_queries_allowed — queries explicitly allowed (whitelist / hot-cache)
#   dgaard_queries_proxied — queries forwarded to the upstream resolver
#
# Typical Prometheus scrape config:
#   - job_name: dgaard
#     static_configs:
#       - targets: ['127.0.0.1:9153']
#
# Port 9153 is the conventional port for DNS-related exporters (used by CoreDNS).
# Use 0.0.0.0:9153 to allow scraping from a remote Prometheus server on the LAN.
# metrics_listen = "127.0.0.1:9153"

# The default order optimized for OpenWrt
pipeline = [
  "Whitelist", # 1. Instant pass
  "HotCache", # 2. Local memory hits
  "StaticBlock", # 3. Exact match (Fast)
  "SuffixMatch", # 4. Wildcards (FST)
  "Heuristics", # 5. DGA/Entropy (Math)
  "Upstream", # 6. Fallback to Internet
]

[server.runtime]
# “auto” uses the number of logical CPU cores.
# An integer (e.g., 2) forces a specific number of threads.
worker_threads = 1

# Stack size per thread (in bytes).
# On OpenWrt, reducing this to 2MB (2 * 1024 * 1024) saves RAM.
stack_size = 2097152

# Capacity of the request queue per worker before rejecting requests.
max_blocking_threads = 512

# Maximum number of DNS queries that may be in-flight simultaneously.
# When this limit is reached, new queries receive a SERVFAIL response
# immediately instead of spawning a new task, preventing OOM under UDP floods.
# Reduce to 128–256 on memory-constrained OpenWrt devices.
max_concurrent_queries = 1024

[security.structure]
# Maximum number of dots (.) in a domain.
# More than 5 often indicates tunneling (e.g., data.part1.bin.zone.com)
max_subdomain_depth = 5

# Maximum allowed length for a fully qualified domain name (RFC max: 253)
max_domain_length = 128

# Reject domains that do not contain only a-z, 0-9, ‘.’, ‘-’, and ‘_’
force_lowercase_ascii = true

# Refuse DNS CHAOS class (qclass=3) queries with REFUSED instead of forwarding
# them upstream. Tools like `dig CH TXT version.bind` use CHAOS queries to
# fingerprint the resolver software — a forwarding proxy should never answer
# these on behalf of its upstream.
block_chaos_class = true

# --- Response Filtering (Inbound) ---
# Maximum length of a TXT field.
# SPF/DKIM records are often < 200 bytes.
# Tunneling often uses the maximum (255 per segment).
max_txt_record_length = 128

# Block if the response contains too many records (suspicious for exfiltration)
max_answers_per_query = 10

[security.lexical]
# Block by words in the domain and sub domains. It is useful for parental control
# since it avoids loading a blacklist of millions of records in RAM.
enabled = true

# Banned keywords (Full labels or separated by hyphens)
banned_keywords = ["porno", "casino", "drogue", "bet", "sex"]

# If true, the keyword must be a complete label (safer)
# If false, a simple .contains() is sufficient (more aggressive)
strict_keyword_matching = true

[security.intelligence]
# DGA & Lexical Analysis (The "Brain")
enabled = true
# Shannon entropy threshold (typically between 3.5 and 4.5)
# The higher the number, the more tolerant the system is of unusual names.
entropy_threshold = 4.0
# Use fast ASCII-only entropy (true) or full Unicode entropy (false)
# Fast mode uses zero heap allocation, ideal for OpenWrt/embedded.
entropy_fast = true
min_word_length = 8

# Consonant clustering detection
# Ratio threshold (e.g., 0.6 blocks domains with >60% consonants like "bcdfgh")
# 0.6 is very aggressive (example: codeberg → 5 consonants (c,d,b,r,g) / 8 letters = 0.625, which is > consonant_ratio_threshold = 0.6)
consonant_ratio_threshold = 0.7
# Max consecutive consonants (normal words rarely exceed 4, e.g., "strength")
max_consonant_sequence = 5

# -----------------------------------------------------------------------------
# N-Gram Language Model Analysis
# -----------------------------------------------------------------------------
# Detects "unnatural" character sequences by scoring domains against language
# models. A domain must pass at least ONE language model to be allowed (OR logic).
use_ngram_model = false

# N-Gram Implementation Mode:
# - true (default): Use embedded Markov matrices (~2.7 KB/language, zero-alloc)
#   Best for OpenWrt/embedded. No external files needed.
# - false: Load full N-gram tables from external .bin files (2-5 MB/language)
#   Higher accuracy but requires file I/O at startup.
ngram_use_embedded = true

# Languages for embedded mode (used when ngram_use_embedded = true)
# Supported: "english", "french", "german", "spanish", "italian"
ngram_embedded_languages = ["english", "french"]

# External model files (used when ngram_use_embedded = false)
ngram_models = ["/etc/dgaard/models/english.bin", "/etc/dgaard/models/french.bin"]

# Log-probability threshold (domains scoring below this in ALL models are blocked)
# Typical range: -6.0 (strict) to -3.0 (lenient). Default: -4.0
ngram_probability_threshold = -4.0

# Drop blacklist entries whose SLD already trips the entropy / consonant
# heuristics above at LOAD time, to save memory. Whitelists are never dropped
# by this optimisation. Default: false.
#
# ⚠️  WARNING — this can SILENTLY UN-BLOCK explicitly listed domains.
# Unlike the structural / TLD / IDN load-time drops (which each map to a HARD
# block at query time), entropy is NOT a query-time block: it only ADDS points
# to the suspicion score (ENTROPY_HIGH = 4, CONSONANT_CLUSTER = 3 → at most 7),
# which is below the default blocking_threshold of 10. So a blacklisted domain
# dropped here is NOT re-blocked by the score unless OTHER signals (NRD, GeoIP,
# low TTL, CNAME cloaking, custom flags, ...) push it over the threshold — and
# those depend on the DNS answer, which cannot be known at load time. If in
# doubt, leave this OFF: keep the explicit blacklist entry and let the score
# add to it at query time.
ignore_entry_matching_entropy = false

[security.idn]
# IDN filtering mode: "Off", "Strict" (block everything), "Smart" (european accent only)
# NOTE: any mode other than "Off" requires BOTH server.block_idn = false AND
# security.structure.force_lowercase_ascii = false, otherwise every non-ASCII
# label is dropped before this filter runs and startup is refused as a
# contradictory configuration. The shipped defaults keep the coarse blocks on,
# so this filter is off by default; opt in by relaxing those two settings.
mode = "Off"
allowed_scripts = ["Latin", "WesternEuropean"]

# NXDOMAIN Hunting and Tunneling/Exfiltration detection are configured in the
# top-level [nxdomain_hunting] and [tunneling_detection] sections below.

# --- Response Filtering (Inbound / DPI Lite) ---
[security.inbound]
# Enable Deep Packet Inspection on DNS answers
enabled = true

# Rejects responses where TXT records have high entropy (sign of tunneling)
# Similar to domain entropy, but applied to the TXT payload.
max_txt_entropy = 4.5

# Follow CNAME chains and block if the final destination is blacklisted
unmask_cname_cloaking = true

# Anti-DNS Rebinding: Block public domains resolving to local IPs
# (127.0.0.1, 192.168.x.x, 10.x.x.x, etc.)
block_private_ip_in_public_res = true

# Block specific query types often used for tunneling or reconnaissance
# e.g., ["NULL", "ANY", "HINFO"]
forbidden_qtypes = ["NULL"]

[forwarder]
# Servers used when [server] mode = "forwarder".
# (Renamed from [upstream] in the Phase 1 recursive-DNS work — the parser
# now rejects [upstream] outright with a pointer back here.)
# Using DNS-over-HTTPS (DoH) or standard UDP
servers = ["1.1.1.1:53", "9.9.9.9:53"]

# -----------------------------------------------------------------------------
# [recursive] — iterative resolver tuning (used when [server] mode = "recursive")
# -----------------------------------------------------------------------------
[recursive]
# Optional BIND-style root hints file. When unset, the compiled-in IANA root
# server set is used. The compiled set is diffed against named.root weekly.
# root_hints_path = "/etc/dgaard/root.hints"

# Hard ceiling on delegation hops; fallback for non-repeating deep chains.
max_delegation_depth = 8

# Cap on the total number of upstream queries per top-level client
# resolution (CNAME chase + out-of-zone NS lookup are amortised against
# the same budget so an amplifying chain can't escape).
max_queries_per_resolution = 64

# Maximum CNAME chain length before returning SERVFAIL.
max_cname_depth = 10

# Per-nameserver UDP query timeout (ms).
query_timeout_ms = 3000

# RFC 9156 QNAME minimization. Accepted today; the loop currently sends
# the full QNAME (this will tighten in the follow-up Phase 2 commit).
qname_minimization = true

# Strict (true, default) refuses out-of-bailiwick referrals up-front;
# lenient (false) is more tolerant of misconfigured zones.
strict_bailiwick = true

# "sequential" (default), "staggered", or "parallel".
# Today only "sequential" is implemented in the loop; the others are
# accepted by the parser for forward compatibility.
ns_concurrency = "sequential"
max_concurrent_queries = 2
ns_stagger_ms = 200

# Advertise an EDNS0 OPT record on outgoing queries (RFC 6891). 1232 is
# the DNS Flag Day 2020 fragmentation-safe payload size.
edns0_enabled = true
edns0_udp_payload_size = 1232

# Popularity persistence (Phase 3 + 4). The tracker counts cache hits
# and decays them with a half-life of `decay_half_life_secs`. Every
# `save_interval_secs` the top `save_top_domains` are written to
# `save_path` (rkyv binary, framed with a 8-byte header); identical
# writes are skipped to spare flash on idle home routers. Set
# `save_interval_secs = 0` or empty `save_path` to disable persistence.
save_top_domains = 2048
save_path = "/var/dgaard/top-domains.bin"
save_interval_secs = 600
decay_half_life_secs = 86400
timeout_ms = 2000
# DNS0x20 case randomization (Dagon et al., 2008).
# Randomly flips the case of ASCII letters in the outgoing QNAME. A compliant
# upstream echoes the QNAME back verbatim; responses that do not match are
# rejected as forged. Combines with the 16-bit TXID to harden against
# Kaminsky-style cache-poisoning attacks at zero cryptographic cost.
# Set to false if your upstreams normalize case (some non-compliant servers do).
use_0x20_randomization = true

# -----------------------------------------------------------------------------
# Background prefetch worker (Phase 5)
# -----------------------------------------------------------------------------
# When a cache hit is about to expire, fire-and-forget a refresh request
# onto a bounded MPSC channel; a single worker task drains it through the
# active resolver (forwarder or recursive) and rewrites the cache entry
# before the client has to wait for a fresh upstream round-trip.
[prefetch]
enabled = true
# Minimum gap between two consecutive prefetch resolutions.
interval_ms = 200
# Bounded channel depth. Excess requests are dropped (and counted in
# prefetch_dropped_total) rather than blocking the query path.
queue_capacity = 256
# Fire the prefetch when remaining TTL falls below this many seconds.
# Set to 0 to disable the trigger.
ttl_remaining_trigger_secs = 30

# -----------------------------------------------------------------------------
# TLD Filtering
# -----------------------------------------------------------------------------
[tld]
# If not empty, only these TLDs are resolved.
# allow_only = [".com", ".net", ".org", ".io"]
# Block high-risk TLDs common in malware/DGA
exclude = [".top", ".xyz", ".bid", ".country", ".stream", ".gdn"]

# Conditional blocking: blocks if it contains a banned_keyword AND this TLD
suspicious_tlds = [
  ".biz",
  ".bible",
  ".top",
  ".su",
  ".li",
  ".es",
  ".sbs",
  ".cfd",
  ".ru",
  ".pub",
  # also works without dots
  "so",
  "icu",
  "re",
  "ua",
  "online",
  "ro",
  "click",
  "ar",
  "vip",
  "xin",
  "cn",
  "xyz",
  "bond",
  "cc",
  "win",
  "help",
  "support",
  "quest",
  "buzz",
  "fyi",
]

# DNS Rebinding Shield configuration.
#
# Rejects upstream DNS answers that map a public domain to a private or
# reserved IP address. This closes the DNS rebinding attack vector where
# an attacker's domain briefly resolves to a LAN IP to reach internal hosts.
#
# ## Covered private ranges
# | Range           | Spec       | Threat                              |
# |-----------------|------------|-------------------------------------|
# | 0.0.0.0/8       | RFC 1122   | "This" network, unroutable          |
# | 10.0.0.0/8      | RFC 1918   | Private LAN                         |
# | 100.64.0.0/10   | RFC 6598   | Shared address space / CGNAT        |
# | 127.0.0.0/8     | RFC 1122   | Loopback                            |
# | 169.254.0.0/16  | RFC 3927   | Link-local / APIPA                  |
# | 172.16.0.0/12   | RFC 1918   | Private LAN                         |
# | 192.168.0.0/16  | RFC 1918   | Private LAN                         |
# | ::1/128         | RFC 4291   | IPv6 loopback                       |
# | fc00::/7        | RFC 4193   | IPv6 unique local                   |
# | fe80::/10       | RFC 4291   | IPv6 link-local                     |
# RFC 6761 special-use domain isolation.
#
# Prevents forwarding queries for reserved or internal TLDs to public
# upstream resolvers. These names have no ICANN delegation and sending them
# upstream leaks internal topology and is semantically incorrect.
#
# Built-in set (always applied when enabled):
#   .local      — mDNS / Bonjour (RFC 6762). Must never reach unicast DNS.
#   .localhost  — Loopback alias (RFC 6761). Always 127.0.0.1 / ::1.
#   .invalid    — Guaranteed non-resolvable by design (RFC 6761).
#   .test       — Reserved for testing; no public delegation (RFC 6761).
#   .example    — Reserved for documentation (RFC 2606).
[security.special_use]
enabled = true
# Additional TLDs to isolate beyond the RFC 6761 defaults.
# Common in split-horizon / corporate deployments.
# extra_local_tlds = [".corp", ".lan", ".internal", ".home", ".intranet"]

[security.rebinding_shield]
enabled = true
# Refuse PTR queries (*.in-addr.arpa / *.ip6.arpa) for RFC 1918, loopback,
# and link-local IP ranges. Prevents forwarding these queries to a public
# upstream resolver, which would expose internal host names and LAN topology
# to third-party DNS infrastructure.
block_ptr_leak = true

# Low-TTL suspicion scoring configuration.
#
# DNS responses with a very short TTL are characteristic of fast-flux malware
# infrastructure, where IP addresses rotate rapidly to evade static blocklists.
# Legitimate CDNs can also use short TTLs, so this check adds suspicion points
# rather than blocking outright — it contributes to the cumulative score.
[security.low_ttl]
enabled = true
# TTL threshold in seconds. Responses with `min_ttl < threshold_secs`
# add `LOW_TTL` suspicion points (default: 10 s).
threshold_secs = 10
# Optional cache TTL floor in seconds. When set, any TTL below this value is
# clamped upward before the result is written to the cache. Prevents fast-flux
# domains from bypassing the cache with near-zero TTLs. Omit or comment out
# to leave observed TTLs unchanged (default: no floor).
# min_ttl_floor_secs = 30

# ASN (Autonomous System Number) IP-range filtering.
#
# Blocks DNS responses that resolve to IP addresses within the configured CIDR
# ranges. Intended for blocking known-malicious autonomous systems such as:
#   - Crypto mining pool infrastructure
#   - Bulletproof hosting providers
#   - Known C2 (command-and-control) server networks
#
# Unlike blocklists that enumerate domains, this filter targets IP space,
# catching fast-flux campaigns that rotate through many domains but use a
# stable set of hosting ranges.
#
# CIDR ranges are pre-parsed once at startup — hot-path matching is O(1) per IP.
# Disabled by default: requires explicit operator configuration derived from
# threat intelligence feeds (e.g., Spamhaus ASN DROP list, abuse.ch, etc.).
#
# ## Address families
# Both IPv4 and IPv6 CIDR notation are supported in the same list.
#
# ## Examples
# RFC 5737 documentation ranges used here — replace with real threat intel data.
[security.asn_filter]
enabled = false
# blocked_ranges = [
#   "203.0.113.0/24",   # IPv4 documentation range (RFC 5737)
#   "198.51.100.0/24",  # IPv4 documentation range (RFC 5737)
#   "2001:db8::/32",    # IPv6 documentation range (RFC 3849)
# ]

# GeoIP country-based suspicion scoring.
#
# After a successful DNS resolve, checks each A/AAAA address against a
# MaxMind-compatible MMDB database. IPs from listed countries add
# `suspicious_country_score` points to the domain's suspicion total.
# The database is opened with mmap to minimise RAM usage on OpenWrt.
#
# Free database: https://www.maxmind.com/en/geolite-free-ip-geolocation-data
# Alternatives:  https://db-ip.com/db/  |  https://www.ip2location.com/database
[security.geo_ip]
enabled = false
# Path to a MaxMind-format MMDB file (GeoLite2-Country, GeoIP2-Country, etc.)
database_path = "/etc/dgaard/GeoLite2-Country.mmdb"
# ISO 3166-1 alpha-2 country codes considered suspicious
suspicious_countries = ["RU", "CN", "KP", "IR"]
# Suspicion points added per matching IP (default: 3; max useful: 10 to hard-block)
suspicious_country_score = 3

# -----------------------------------------------------------------------------
# Behavior Monitoring
# -----------------------------------------------------------------------------
[nxdomain_hunting]
enabled = true
# Number of NXDOMAINs before a client is flagged
threshold = 15
# Time window in seconds
window_seconds = 60
# Action: "log" or "block_client" (via firewall integration)
action = "log"

[tunneling_detection]
enabled = true
# Max unique subdomains per SLD (e.g., v1.x.example.com)
max_subdomains_per_minute = 50
# Max length of a single label (detects Base64 payloads)
max_label_length = 60

# -----------------------------------------------------------------------------
# File-Based Sources
# -----------------------------------------------------------------------------
[sources]
# Newly Registered Domains (NRD)
# This file should be updated daily via cron
nrd_list_path = "/tmp/nrd_daily.txt"

# Static blocklists (Support for multiple files)
# You can get some here: https://filterlists.com/
blacklists = [
  # "/etc/dgaard/lists/adaway.txt",
  # "/etc/dgaard/lists/malware_domains.txt",
  "https://raw.githubusercontent.com/Perflyst/PiHoleBlocklist/refs/heads/master/SmartTV.txt",
  "https://pgl.yoyo.org/as/serverlist.php?hostformat=adblock;showintro=1&mimetype=plaintext",
  "https://filters.adtidy.org/extension/ublock/filters/11.txt",
  # "https://easylist.to/easylist/easylist.txt",
  "https://easylist-downloads.adblockplus.org/liste_ar+liste_fr+easylist.txt",

  # annoyances
  "https://filters.adtidy.org/extension/ublock/filters/14.txt",
  # "https://easylist-downloads.adblockplus.org/fanboy-annoyance.txt"
  # "https://fanboy.co.nz/enhancedstats.txt"

  # widgets
  "https://filters.adtidy.org/windows/filters/22.txt",

  # cookie notice
  "https://www.i-dont-care-about-cookies.eu/abp/",

  # privacy
  "https://filters.adtidy.org/extension/ublock/filters/118_optimized.txt",
  # "https://filters.adtidy.org/extension/ublock/filters/3.txt"
  # "https://filters.adtidy.org/windows/filters/17.txt"

  # malware
  "https://raw.githubusercontent.com/DandelionSprout/adfilt/master/Alternate%20versions%20Anti-Malware%20List/AntiMalwareAdGuard.txt",
]

# Whitelists (Overwrites all other filters)
whitelists = [
  # "/etc/dgaard/lists/personal_whitelist.txt",
  # "/etc/dgaard/lists/cdn_providers.txt"
  "https://raw.githubusercontent.com/anudeepND/whitelist/master/domains/whitelist.txt",
]

update_interval_hours = 24
# If the download fails, how long to wait before retrying
retry_delay_mins = 30
# Maximum seconds allowed for a full list reload (all sources combined).
# If the deadline is exceeded the operation is aborted and the previously
# loaded engine stays active. Set to 0 to disable the timeout entirely.
reload_timeout_secs = 30

# Binary index mapping each xxh3_64 hash to its source domain string.
# External tools (dashboard, scripts) can use this file to resolve a hash
# back to a human-readable domain without loading the full blocklist.
# Set to "" to disable.
host_index_path = "/var/dgaard/host_mapping.bin"

# Plain text file collecting ABP cosmetic/element-hiding/scriptlet rules
# that are ignored by the DNS filter. Import this file into a browser
# extension (e.g. uBlock Origin) to get full ad/tracker blocking.
# Set to "" to disable.
browser_rules_path = "/var/dgaard/browser_rules.txt"

[abp]
# Since many ABP rules are COSMETIC (CSS), we only extract Network/Domain rules.
extract_domain_only = true
# Update interval in hours
update_interval = 24

# -----------------------------------------------------------------------------
# DNS Response Cache
# -----------------------------------------------------------------------------
#
# TTL-aware LRU cache for upstream DNS responses.
#
# When enabled, successful responses are stored keyed by (domain, qtype).
# Subsequent queries for the same (domain, qtype) pair are answered from the
# cache without hitting the upstream resolver, reducing latency and upstream
# load. Entries expire after the DNS TTL elapses and are evicted lazily.
#
# The response bytes are stored verbatim; the transaction ID (bytes 0–1) is
# patched per-query before sending so each client receives a valid response.
#
# Only answers that contain at least one resource record (i.e., non-NXDOMAIN
# responses) are cached. SERVFAIL and blocked responses are never stored.
#
# If `security.low_ttl.min_ttl_floor_secs` is set, that floor is applied to
# the TTL before caching, preventing fast-flux domains from bypassing the
# cache with near-zero TTLs.
[cache]
# Master switch — set to `false` to disable response caching entirely.
enabled = true

# Maximum number of entries in the LRU cache.
# When full, the least-recently-used entry is evicted to make room.
# Each entry holds the raw response bytes (~50–500 bytes typical) plus
# metadata. 10 000 entries ≈ 5–50 MiB depending on response size.
max_entries = 10000

# Override the DNS TTL for all cached entries (seconds).
# When non-zero, this value replaces the TTL from the upstream response,
# regardless of how short or long the authoritative TTL is.
# 0 = use the TTL returned by the upstream resolver (recommended).
ttl_override = 0

# Suspicion score thresholds and logging policy.

# Controls at what score level domains are blocked, flagged as highly
# suspicious, or flagged as suspicious. Logging for the two lower tiers
# can be independently enabled to stream telemetry to the Unix socket
# without affecting blocking behaviour.
[security.scoring]
# Score at or above which a domain is considered malicious and blocked.
# Default: 10.
# blocking_threshold = 10

# Score at or above which a domain is considered highly suspicious.
# Queries above this threshold but below `blocking_threshold` are
# forwarded but always emitted as `HighlySuspicious` events on the
# stats socket.
# Default: 7.
# highly_suspicious_threshold = 7

# Score at or above which a domain is considered suspicious.
# Only emitted as a `Suspicious` stats event when `log_suspicious`
# is `true`.
# Default: 4.
# suspicious_threshold = 4

# Emit `Suspicious` stats events for domains that reach
# `suspicious_threshold` but not `highly_suspicious_threshold`.
# Default: `false`.
# log_suspicious = false

# DNSSEC validation using a side-channel hickory resolver.
#
# When enabled, every forwarded query is also sent to the upstream resolvers
# with DNSSEC validation active. The two lookups run in parallel so the added
# latency is at most the difference between the two response times.
#
# If the side-channel resolver returns BOGUS (signature mismatch, broken chain
# of trust), the configured `action` is applied to the client query:
#   "block" — return SERVFAIL (RFC-standard DNSSEC failure response)
#   "log"   — log the event and forward the upstream response unchanged
#             (useful during a trial period to measure false-positive rates)
#
# Zones that do not publish DNSSEC records (Insecure) and queries where the
# validator cannot reach the upstream (Indeterminate) are fail-open: the
# upstream response is forwarded normally.
#
# Note: enabling DNSSEC doubles the number of outgoing queries for each
# forwarded DNS request. Keep this in mind on bandwidth-constrained links.
#
# Default: disabled.
[security.dnssec]
# enabled = false
# action = "block"

# -----------------------------------------------------------------------------
# [[overrides]] — Inline domain overrides
# -----------------------------------------------------------------------------
#
# Each entry forces a fixed IP address for a domain, bypassing all filters
# (blocklists, heuristics, structure checks, etc.). Useful for:
#   - Split-horizon DNS on private infrastructure
#   - Forcing a known-good IP for a domain you trust but that keeps getting
#     flagged by heuristics
#   - Redirecting a domain to a local service
#
# `domain` — exact match or wildcard prefix (*.example.com)
#   Exact:    "example.com"    matches only "example.com"
#   Wildcard: "*.example.com"  matches "sub.example.com", "a.b.example.com"
#             but NOT "example.com" itself
#
# `to` — an IPv4 or IPv6 address to return
#   If the client queries for a record type that doesn't match the address
#   family (e.g. AAAA query with an IPv4 override), dgaard returns a NOERROR
#   with an empty answer section so the client falls back gracefully.
#
# Events are emitted with action "Override" in the TUI and forwarding sinks.
# Multiple entries are supported.
#
