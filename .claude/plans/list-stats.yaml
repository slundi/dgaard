          The current members are: `["adblockptimize", "dgaard", "dgaard-daemon", "dgaard-engine", "dgaard-monitor", "dgaard-rest"]`
          Add `"list-stats"` to become: `["adblockptimize", "dgaard", "dgaard-daemon", "dgaard-engine", "dgaard-monitor", "dgaard-rest", "list-stats"]`

          **3. Create a minimal /home/seb/workspace/dgaard/list-stats/src/main.rs** that just compiles:

